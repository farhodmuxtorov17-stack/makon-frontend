name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install ishlatiladi: lock fayl Windows’da yaratilgani uchun
      # npm ci Linux’dagi platformaga xos paketlarda uzilib qolishi mumkin.
      - name: Bog‘liqliklarni o‘rnatish
        run: npm install --no-audit --no-fund

      - name: Komponentlarni tekshirish
        run: npm run check

      - name: Yig‘ish
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npx nuxt generate

      - name: SPA uchun zaxira sahifa
        run: |
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
